name: Tests and deployment

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - name: Validate project metadata
        run: |
          python - <<'PY'
          import pathlib
          import tomllib
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]
          assert project["name"] == "service-operations-analysis"
          print("Project metadata parsed successfully.")
          PY
      - name: Validate package syntax and import
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src
          python -c "import service_analysis; print('Package import succeeded.')"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run deterministic tests
        run: python -m pytest -q
      - name: Build production container
        run: docker build --tag service-analysis:ci .
      - name: Start production container
        run: docker run --detach --rm --name analysis-demo --publish 127.0.0.1:7860:7860 service-analysis:ci
      - name: Check container startup and isolation
        run: |
          python scripts/check_container.py
          docker exec analysis-demo python -c "import os, pathlib; assert os.getuid() == 1000; assert pathlib.Path('app.py').is_file(); assert not pathlib.Path('.git').exists(); assert not pathlib.Path('tests').exists(); assert not pathlib.Path('.env').exists()"
      - name: Stop production container
        if: always()
        run: docker stop analysis-demo || true

  deploy:
    needs: scaffold
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.HF_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: hugging-face-deployment
      cancel-in-progress: false
    steps:
      - name: Check out tested source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - name: Install deployment client
        run: python -m pip install "huggingface_hub==1.33.0"
      - name: Publish allowlisted bundle to existing Space
        env:
          HF_DEPLOY_TOKEN: ${{ secrets.HF_DEPLOY_TOKEN }}
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python scripts/deploy_space.py

